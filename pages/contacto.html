<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Lexend:wght@100..900&family=Outfit:wght@100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css"/>
    <title>Contacto | El Caldero</title>
</head>
<body>
    <header>
        <div class="div=logo"><a class="logo" href="../index.html">El Caldero</a></div>
        <nav class="header-nav">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contacto">
            <h1 class="título-contacto text-secondary">Contacto</h1>
            <form class="form-contacto" action="" method="POST">
                <div class="grupo-input">
                    <label for="email">Correo electrónico:</label>
                    <input id="email" type="email" name="email"/>
                </div>

                <div class="grupo-input">
                    <label for="mensaje">Tu mensaje:</label>
                    <textarea id="mensaje" name="message"></textarea>
                </div>
                <button class="btn bg-secondary text-dark" type="submit">Enviar</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Este sitio es responsabilidad del gremio de arcanos.</p>
        <nav>
            <ul class="footer-list">
                <li><img src="../images/logo_instagram.png" alt="imagen: Logo Instagram"/></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
